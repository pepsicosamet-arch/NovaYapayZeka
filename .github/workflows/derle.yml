name: Windows kurulum dosyasını derle

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json']   # package.json'daki sürüm artınca kendiliğinden derlenip yayınlanır
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarası
        shell: bash
        run: echo "NOVA_TAG=v$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NOVA-Yapay-Zeka-Windows
          path: |
            dist/*.exe
            dist/latest.yml
      - name: Sürüm yayınla
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          name: NOVA Yapay Zeka ${{ env.NOVA_TAG }}
          tag_name: ${{ env.NOVA_TAG }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
